[project]
name = "ml-project"
version = "0.2.0"
description = "Sentinel-1 SAR vegetation risk engine for GridCanopy"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.7",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "imbalanced-learn>=0.12",
    "rasterio>=1.4",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=2.0",
    "pandas>=2.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
gee = ["earthengine-api>=1.0", "geemap>=0.30"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["ml_project*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RET", "C4"]
ignore = [
    "ANN401",  # Any is the honest type for a duck-typed sklearn estimator
    "B008",    # config defaults in signatures are deliberate
]

[tool.ruff.lint.per-file-ignores]
"ml_project/test_pipeline.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["ml_project"]
